[package]
name = "pflogreport"
version = "0.2.0"
edition = "2024"
description = "Analyze Postfix mail logs: reconstruct messages by queue ID, report delivery status, and classify bounce and defer reasons."
authors = ["Anton Ageev <antage@gmail.com>"]
license = "MIT"
repository = "https://github.com/antage/pflogreport"
readme = "README.md"
rust-version = "1.85"
keywords = ["postfix", "mail", "log", "bounce", "cli"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[dependencies]
anyhow = "1"
nom = "7"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_derive = "1"
serde_json = "1"
lazy-regex = "3"
enum-kinds = "0.5"
rayon = "1"
